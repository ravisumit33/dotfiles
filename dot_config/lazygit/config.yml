# lazygit config
# Docs: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

git:
  pagers:
    - colorArg: always
      pager: delta --paging=never

customCommands:
  - key: "U"
    context: "global"
    description: "Update all submodules to remote (recursive)"
    command: "git submodule update --init --remote --recursive"
    loadingText: "Updating all submodules to remote recursively..."
    output: log

  - key: "U"
    context: "submodules"
    description: "Update selected submodule to remote (recursive)"
    command: "git submodule update --init --remote --recursive -- '{{ .SelectedSubmodule.Path }}'"
    loadingText: "Updating selected submodule to remote recursively..."
    output: log

  - key: "b"
    context: "worktrees"
    description: "Create worktree from existing branch"
    prompts:
      - type: "input"
        title: "Branch to check out into new worktree"
        key: "Branch"
        suggestions:
          preset: "branches"
      - type: "input"
        title: "New worktree path"
        key: "Path"
        initialValue: "{{ .Form.Branch }}"
    command: "git worktree add '{{ .Form.Path }}' '{{ .Form.Branch }}'"
    loadingText: "Adding worktree for existing branch..."
    output: log

  - key: "V"
    context: "files"
    description: "View diff in codediff.nvim"
    command: |
      f="$PWD/{{ .SelectedPath }}"
      if [ -n "$NVIM" ]; then
        nvim --server "$NVIM" --remote-expr "luaeval('require(\"utils.lazygit_codediff\").open(_A)', '$f')" >/dev/null
      elif [ -n "$TMUX" ]; then
        tmux new-window "nvim -c \"lua require('utils.lazygit_codediff').open([[$f]])\""
      else
        nvim -c "lua require('utils.lazygit_codediff').open([[$f]])"
      fi
    output: none # RPC/new-window branches above don't need lazygit's terminal (TTY).
